name: Deploy

# Builds the data and the static site, then deploys it to Cloudflare Workers (static assets only).
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template permissions
#   CLOUDFLARE_ACCOUNT_ID
# Optional repository variable:
#   SITE_URL               public origin (e.g. https://dictionary.example.com) for hreflang links

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly, picks up the latest Wiktionary data
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10 # wordfreq export in fetch-data

      - name: Week number (raw data cache key)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: raw
          key: raw-${{ steps.week.outputs.week }}

      - run: pnpm fetch-data
      - run: pnpm build-data
      - run: pnpm test # view model checks on the freshly built data
      - run: pnpm build

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm run deploy
      - name: Skip deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy."
